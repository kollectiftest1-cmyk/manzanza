# Université MAZANZA — déploiement de production (voir deploy/DEPLOIEMENT.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-manzanza}
      POSTGRES_USER: ${DB_USER:-manzanza}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-manzanza}"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DEBUG: "False"
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - media:/srv/manzanza/media
      - static:/srv/manzanza/static

  # Tâches planifiées : purge de la corbeille (rétention configurable) chaque nuit.
  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DEBUG: "False"
    depends_on: [backend]
    volumes: [media:/srv/manzanza/media]
    command: ["sh", "-c", "while true; do python manage.py purge_trash; sleep 86400; done"]

  web:
    build: ./web
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: [backend]
    volumes:
      - media:/srv/manzanza/media:ro
      - static:/srv/manzanza/static:ro

volumes:
  pgdata:
  media:
  static:
