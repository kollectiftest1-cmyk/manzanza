# nginx — Université MAZANZA (même domaine pour l'application et l'API :
# le cookie de session httpOnly reste « first-party »).
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host;
                       proxy_set_header X-Forwarded-Proto $scheme; }
    location /static/ { alias /srv/manzanza/static/; expires 7d; }

    # Fichiers privés : jamais servis par nginx, uniquement par Django après contrôle
    # de la signature (liens à durée limitée). Liste identique à apps/core/media.py.
    location ~ ^/media/(inscriptions|contracts|deliberations|documents|receipts|assignments/submissions|quiz/answers|chat_attachments)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Fichiers publics (avatars, supports de cours, couvertures…)
    location /media/ { alias /srv/manzanza/media/; expires 1d; }

    # Application monopage (React Router)
    location / { try_files $uri /index.html; }
}
